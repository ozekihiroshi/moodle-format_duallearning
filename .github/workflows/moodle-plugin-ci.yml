name: Moodle Plugin CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moodle-plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Moodle 5.2 / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
    steps:
      - name: Check out Dual Learning
        uses: actions/checkout@v6
        with:
          path: moodle-format_duallearning
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip, gd, intl, soap
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Install Moodle Plugin CI
        run: |
          composer create-project --no-interaction --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci 4.5.11
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle and Dual Learning
        env:
          DB: mariadb
          MOODLE_BRANCH: MOODLE_502_STABLE
        run: >-
          ci/bin/moodle-plugin-ci install
          --plugin ./moodle-format_duallearning
          --db-host=127.0.0.1

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Plugin validation
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

  release-zip:
    name: Reproducible release ZIP
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Dual Learning
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build twice and compare
        run: |
          python3 scripts/build-release.py
          cp build/moodle-format_duallearning-0.1.0-alpha3.zip /tmp/duallearning-first.zip
          python3 scripts/build-release.py
          cmp /tmp/duallearning-first.zip build/moodle-format_duallearning-0.1.0-alpha3.zip

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: format_duallearning-${{ github.sha }}
          path: build/moodle-format_duallearning-0.1.0-alpha3.zip
          if-no-files-found: error
          retention-days: 14
